# Primary pipeline: `master` is the net11.0 / C# 15 preview line, built with the .NET 11 SDK pinned in
# global.json. The net10.0 / C# 14 line is parked on `release/v2.0` and is built by ci-net10.yml.
name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
    # v2.0.x tags belong to the parked net10 line (ci-net10.yml); without the exclusion a servicing tag
    # shows a red run here that says nothing about the net11 release itself.
    tags: [ 'v*', '!v2.0*' ]
  pull_request:
    branches: [ master, develop ]
  # Manual runs build and test on demand. Packing stays push-to-master only; publishing moved to
  # publish.yml (nuget.org trusted publishing), which runs after a green CI run on master.
  workflow_dispatch:

# Least privilege at the workflow level: nothing here publishes any more, so no job carries a
# package-writing token (Sonar S8233). publish.yml requests `id-token: write` for itself instead.
permissions:
  contents: read

env:
  # .NET 11 SDK, GA since 2026-11-10. `11.0.x` follows the servicing patches; `global.json` still pins the
  # exact baseline (11.0.100, rollForward latestPatch) for local builds and for the runtime-async codegen.
  # One place to change, five setup steps consume it.
  DOTNET_VERSION: '11.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  CI_TEST_FILTER: 'Category!=Debug&Category!=Manual&Category!=Performance'

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET 11 (GA)
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Display .NET info
      run: dotnet --info

    - name: Restore dependencies
      run: dotnet restore SharpCoreDB.CI.slnf --configfile NuGet.Config /p:UseLocalProjectReferences=true

    - name: Fail on deprecated NuGet packages
      shell: pwsh
      run: |
        $output = dotnet list SharpCoreDB.CI.slnf package --deprecated --configfile NuGet.Config
        $outputText = $output | Out-String
        Write-Host $outputText

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to evaluate deprecated packages."
          exit $LASTEXITCODE
        }

        if ($outputText -match "has the following deprecated packages") {
          Write-Error "Deprecated NuGet packages detected. CI is configured to fail."
          exit 1
        }

        Write-Host "No deprecated NuGet packages detected."

    - name: Fail on vulnerable NuGet packages
      shell: pwsh
      run: |
        $output = dotnet list SharpCoreDB.CI.slnf package --vulnerable --configfile NuGet.Config
        $outputText = $output | Out-String
        Write-Host $outputText

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to evaluate vulnerable packages."
          exit $LASTEXITCODE
        }

        if ($outputText -match "has the following vulnerable packages") {
          Write-Error "Vulnerable NuGet packages detected. CI is configured to fail."
          exit 1
        }

        Write-Host "No vulnerable NuGet packages detected."

    # .github/SIMD_STANDARDS.md bans System.Numerics.Vector<T>, and nothing else in this build fails
    # when it comes back — the last real usage survived until 2026-09-26. The checker self-tests its own
    # detector first, then scans src/**/*.cs; both exit codes are propagated explicitly.
    - name: Fail on banned portable SIMD API
      shell: pwsh
      run: |
        ./tools/check-banned-simd-api.ps1 -SelfTest
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./tools/check-banned-simd-api.ps1
        exit $LASTEXITCODE

    - name: Build
      run: dotnet build SharpCoreDB.CI.slnf --configuration Release --no-restore /p:ContinuousIntegrationBuild=true /p:UseLocalProjectReferences=true

    # MTP (xunit.v3) test hosts on .NET 11 do not support `dotnet test`'s VSTest flags
    # (e.g. --collect "XPlat Code Coverage", --logger trx, --blame-hang). CI runs the MTP
    # executable directly, which understands the same VSTest filter expression and writes TRX.
    - name: Test SharpCoreDB.Tests
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ./TestResults/SharpCoreDB.Tests
        tests/SharpCoreDB.Tests/bin/Release/net11.0/SharpCoreDB.Tests \
          -filterVSTest "${{ env.CI_TEST_FILTER }}" \
          -result-trx "./TestResults/SharpCoreDB.Tests/SharpCoreDB.Tests.trx"
      timeout-minutes: 30
      env:
        CI: "true"
        GITHUB_ACTIONS: "true"

    - name: Test SharpCoreDB.VectorSearch.Tests
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ./TestResults/SharpCoreDB.VectorSearch.Tests
        tests/SharpCoreDB.VectorSearch.Tests/bin/Release/net11.0/SharpCoreDB.VectorSearch.Tests \
          -filterVSTest "${{ env.CI_TEST_FILTER }}" \
          -result-trx "./TestResults/SharpCoreDB.VectorSearch.Tests/SharpCoreDB.VectorSearch.Tests.trx"
      timeout-minutes: 15
      env:
        CI: "true"
        GITHUB_ACTIONS: "true"

    - name: Test SharpCoreDB.EntityFrameworkCore.Tests
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ./TestResults/SharpCoreDB.EntityFrameworkCore.Tests
        tests/SharpCoreDB.EntityFrameworkCore.Tests/bin/Release/net11.0/SharpCoreDB.EntityFrameworkCore.Tests \
          -filterVSTest "${{ env.CI_TEST_FILTER }}" \
          -result-trx "./TestResults/SharpCoreDB.EntityFrameworkCore.Tests/SharpCoreDB.EntityFrameworkCore.Tests.trx"
      timeout-minutes: 15
      env:
        CI: "true"
        GITHUB_ACTIONS: "true"

    - name: Test SharpCoreDB.Functional.Linq2DB.Tests
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ./TestResults/SharpCoreDB.Functional.Linq2DB.Tests
        tests/SharpCoreDB.Functional.Linq2DB.Tests/bin/Release/net11.0/SharpCoreDB.Functional.Linq2DB.Tests \
          -filterVSTest "${{ env.CI_TEST_FILTER }}" \
          -result-trx "./TestResults/SharpCoreDB.Functional.Linq2DB.Tests/SharpCoreDB.Functional.Linq2DB.Tests.trx"
      timeout-minutes: 10
      env:
        CI: "true"
        GITHUB_ACTIONS: "true"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: '**/TestResults/**/*.trx'
        if-no-files-found: ignore

  # Dedicated coverage job, carried over from the v2.1 RC pipeline (ci-net11.yml) when it became the
  # primary one. `dotnet test` cannot collect here: xUnit v3 runs on Microsoft.Testing.Platform, which
  # rejects the VSTest target, and the test host is xUnit's own in-process runner, which registers no
  # coverage extension (its `--help` has none, and `--coverage` answers "unknown option"). The reports
  # therefore come from `dotnet-coverage collect` wrapped around the same test hosts the build job runs —
  # tools/measure-coverage.ps1 does that, merges the reports and enforces codecov.yml's 18% floor in-job,
  # so the verdict does not depend on the upload succeeding. Ubuntu only and once: it runs the suites a
  # second time under instrumentation, and line coverage does not change per operating system.
  coverage:
    name: Coverage (net11.0)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # The global.json pin already selects the SDK; setup-dotnet only has to make a GA 11.0 SDK available.
    - name: Setup .NET 11 (GA)
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore tools
      run: dotnet tool restore --configfile NuGet.Config

    # The aggregation and the floor comparison are self-tested before any suite runs, the way
    # tools/check-banned-simd-api.ps1 self-tests its detector before scanning the tree.
    - name: Self-test the coverage gate
      shell: pwsh
      run: ./tools/measure-coverage.ps1 -SelfTest

    - name: Measure coverage and enforce the floor
      shell: pwsh
      # `Category!=Allocation` keeps the allocation-ceiling canaries out of an *instrumented* run. Code coverage
      # changes what the JIT is allowed to do, so those assertions stop measuring the engine and start measuring
      # dotnet-coverage: measured 2026-11-12 on this job, the Runtime Async elision disappeared (0 → 71.424 bytes
      # over 1.000 awaited calls, i.e. exactly the classic figure) and the batch-INSERT canary read 902 instead of
      # 894 B/row. They still run — and gate — in the uninstrumented `Build and Test` jobs above.
      run: ./tools/measure-coverage.ps1 -Floor 0.18 -Filter "Category!=Debug&Category!=Manual&Category!=Performance&Category!=Allocation"

    - name: Upload coverage reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: artifacts/coverage/*.cobertura.xml
        if-no-files-found: error

    # No `flags:` on purpose: codecov.yml's project and patch statuses read the unflagged coverage, so
    # flagging these uploads would leave those statuses with no data (`if_no_uploads: error`).
    - name: Upload to Codecov
      if: ${{ !cancelled() }}
      # Pinned to a commit SHA rather than the moving `v5` tag (Sonar S7637): a tag can be repointed at a
      # different commit, a SHA cannot. Bump deliberately, with the release notes of the new version.
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: artifacts/coverage/*.cobertura.xml
        disable_search: true
        fail_ci_if_error: false
        verbose: true

  pack:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET 11 (GA)
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Discover packable projects
      id: discover-packable
      shell: bash
      run: |
        set -euo pipefail

        projects=()
        while IFS= read -r -d '' project; do
          is_packable="$(dotnet msbuild "$project" -nologo -getProperty:IsPackable | tr -d '\r')"
          package_id="$(dotnet msbuild "$project" -nologo -getProperty:PackageId | tr -d '\r')"

          if [ "$is_packable" = "true" ] && [ -n "$package_id" ]; then
            projects+=("$project")
            echo "Packable: $project ($package_id)"
          else
            echo "Skipped: $project (IsPackable=$is_packable, PackageId=$package_id)"
          fi
        done < <(find ./src -name '*.csproj' -print0)

        if [ ${#projects[@]} -eq 0 ]; then
          echo "No packable projects found under ./src"
          exit 1
        fi

        {
          echo "packable_projects<<EOF"
          printf '%s\n' "${projects[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        echo "Discovered ${#projects[@]} packable project(s)."

    - name: Pack NuGet packages
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ./artifacts

        while IFS= read -r project; do
          [ -n "$project" ] || continue
          echo "Packing $project"
          dotnet pack "$project" \
            --configuration Release \
            --output ./artifacts \
            /p:ContinuousIntegrationBuild=true \
            /p:UseLocalProjectReferences=true \
            --configfile NuGet.Config
        done <<< "${{ steps.discover-packable.outputs.packable_projects }}"

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
        retention-days: 30
