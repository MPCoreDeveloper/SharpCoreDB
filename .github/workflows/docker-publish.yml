name: Docker

on:
  push:
    # The Dockerfile is net11-aware (sdk:11.0 / aspnet:11.0) since the promotion, so v2.1+ tags produce an
    # image again — the open item recorded in the 2.1.0-RC.3 release notes is closed. v2.0.x is excluded:
    # that line is parked on release/v2.0 with its own net10.0 Dockerfile.
    tags: [ 'v*', '!v2.0*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mpcoredeveloper/sharpcoredb-server

jobs:
  build-and-push:
    name: Build & push SharpCoreDB server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Compute image tags
      id: meta
      shell: pwsh
      run: |
        $version = if ("${{ github.ref_type }}" -eq 'tag') { "${{ github.ref_name }}".TrimStart('v') } else { "${{ github.sha }}".Substring(0, 7) }
        $tags = @("${{ env.IMAGE_NAME }}:$version")
        if ("${{ github.ref_type }}" -eq 'tag') {
          $tags += "${{ env.IMAGE_NAME }}:latest"
        }
        Write-Host "Version: $version"
        Write-Host "Tags: $($tags -join ', ')"
        "version=$version" >> $env:GITHUB_OUTPUT
        "tags=$($tags -join ',')" >> $env:GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: src/SharpCoreDB.Server/Dockerfile
        push: true
        platforms: linux/amd64, linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
        labels: |
          org.opencontainers.image.title=SharpCoreDB Server
          org.opencontainers.image.description=SharpCoreDB network database server (gRPC + HTTPS)
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
