# SonarCloud configuration for MPCoreDeveloper/SharpCoreDB.
#
# This project is analysed by SonarCloud **automatic analysis** (there is no scanner step in
# .github/workflows/ci.yml). Automatic analysis cannot import a coverage report, which is why the coverage
# measures are empty for this project. Line coverage is measured in CI instead: `tools/measure-coverage.ps1`
# wraps the MTP test hosts in `dotnet-coverage`, enforces codecov.yml's 18% floor inside the job, uploads
# `artifacts/coverage/*.cobertura.xml`, and codecov reports it (42.51% of 59,211 lines on master, 2026-11-13).
# Reporting coverage *inside Sonar* needs a CI-based scan instead, which additionally requires automatic analysis
# to be switched off for the project and a SONAR_TOKEN secret — an owner action.

sonar.projectKey=MPCoreDeveloper_SharpCoreDB
sonar.organization=mpcoredeveloper
sonar.projectName=SharpCoreDB
sonar.sourceEncoding=UTF-8

# False positives, scoped to a single rule and a single file.
#
# S2083 ("I/O function should not be called with paths from untrusted data") fires 11 times in
# SingleFileStorageProvider.cs. That class's entire contract is "open the database file at the path the host
# supplies" — the same model SQLite has. The path is not derived from SQL text or from network input: it is the
# argument the application passed to DatabaseOptions/DatabaseFactory, so the trust boundary is the host, and the
# reported flow (public API parameter → FileStream / File.Move / File.Delete) is the intended design rather than a
# sink for untrusted data. Scoped to this file, so a genuine path-injection anywhere else is still reported.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=roslyn.sonaranalyzer.security.cs:S2083
sonar.issue.ignore.multicriteria.e1.resourceKey=src/SharpCoreDB/Storage/SingleFileStorageProvider.cs
